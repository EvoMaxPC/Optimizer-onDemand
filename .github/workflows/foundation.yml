name: Foundation CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation — restore / build / test (CI_RUNNER)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Report SDK (CI_RUNNER)
        run: dotnet --list-sdks

      - name: dotnet restore
        run: dotnet restore EVO.sln

      - name: dotnet build (Release)
        run: dotnet build EVO.sln -c Release --no-restore

      - name: dotnet test (trx)
        run: dotnet test EVO.sln -c Release --no-build --logger "trx;LogFilePrefix=EVO-Test" --results-directory TestResults

      - name: Verify-Foundation.ps1 (Windows PowerShell 5.1) — CI_RUNNER
        shell: powershell
        run: .\scripts\Validation\Verify-Foundation.ps1

      - name: Upload .trx artifacts (CI_RUNNER) — also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-trx
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload verification output (CI_RUNNER) — also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-verification
          path: foundation-results.txt
          if-no-files-found: warn
